name: Bug report
description: Report a bug or regression
title: "bug: "
labels: ["bug"]
body:
  - type: checkboxes
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues
          required: true
        - label: I read the troubleshooting docs
          required: false
  - type: textarea
    attributes:
      label: What happened
      description: A clear and concise description of the bug.
      placeholder: When I run :AndroidMenu, ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Provide minimal, repeatable steps.
      placeholder: |-
        1. Open project ...
        2. Run :AndroidBuild
        3. See error ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
      placeholder: The build should ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual behavior
      placeholder: The build fails with ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs
      description: Paste relevant output, stack traces, or screenshots.
      render: text
  - type: textarea
    attributes:
      label: Health check output
      description: Paste the output of :checkhealth android from the project root.
      render: text
    validations:
      required: true
  - type: input
    attributes:
      label: Neovim version
      placeholder: nvim --version
    validations:
      required: true
  - type: input
    attributes:
      label: Android SDK
      placeholder: ANDROID_SDK_ROOT or sdk.dir path
    validations:
      required: false
  - type: input
    attributes:
      label: Gradle version
      placeholder: ./gradlew --version
    validations:
      required: false
  - type: input
    attributes:
      label: OS
      placeholder: macOS 14.3, Ubuntu 22.04, Windows 11
    validations:
      required: true
  - type: input
    attributes:
      label: Plugin version
      description: Git commit or release tag.
      placeholder: git rev-parse HEAD
    validations:
      required: false
